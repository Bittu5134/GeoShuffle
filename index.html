<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>GeoShuffle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>

<body class="bg-main-bg text-main-text min-h-screen flex flex-col items-center p-4">

    <main class="w-full max-w-2xl flex flex-col items-center">

        <h1 class="font-extrabold text-6xl md:text-7xl text-center tracking-widest w-full">
            GeoShuffle
        </h1>

        <div class="flex items-center justify-between w-full max-w-xl m-6 px-4">

            <div class="flex gap-2">

                <div class="flex flex-col items-center bg-current/20 rounded-xl px-3 py-2 min-w-[70px]">
                    <span class="text-xs uppercase font-bold">
                        Moves
                    </span>
                    <span id="moves" class="text-2xl font-extrabold">
                        0
                    </span>
                </div>

                <div class="flex flex-col items-center rounded-xl px-3 py-2 min-w-[70px]">
                    <span class="text-xs uppercase font-bold">
                        Best
                    </span>
                    <span id="best" class="text-2xl font-extrabold">
                        0
                    </span>
                </div>

            </div>

            <button id="newGameBtn" class="btn p-4 md:p-6 text-lg md:text-xl whitespace-nowrap">
                New Game
            </button>

        </div>

        <div id="board" class="relative w-full max-w-xl aspect-[6/4] rounded overflow-hidden bg-secondary-bg">
        </div>

    </main>

    <script type="module" src="main.js"></script>

</body>

</html>
