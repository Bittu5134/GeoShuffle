<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>GeoShuffle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Ms+Madi&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
</head>

<body
    class="bg-main-bg text-main-text min-h-screen w-full overflow-x-hidden flex flex-col items-center justify-start p-4 box-border">
    <main class="w-full max-w-2xl flex flex-col items-center justify-center mt-2 box-border">

        <h1
            class="font-extrabold text-6xl md:text-7xl text-center tracking-widest selection:bg-main-text selection:text-main-bg break-words w-full">
            GeoShuffle
        </h1>

        <div class="flex items-center justify-between w-full max-w-xl m-6 px-4 box-border">
            <div class="flex gap-2">
                <div
                    class="flex flex-col items-center bg-current/20 border-4 border-current/10 rounded-xl px-3 py-2 min-w-[70px]">
                    <span class="text-xs uppercase font-bold">Moves</span>
                    <span class="text-2xl font-extrabold">0</span>
                </div>
                <div class="flex flex-col items-center border-4 border-current/20 rounded-xl px-3 py-2 min-w-[70px]">
                    <span class="text-xs uppercase font-bold">Best</span>
                    <span class="text-2xl font-extrabold">1048</span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button class="btn p-4 md:p-6 text-lg md:text-xl whitespace-nowrap">
                    New Game
                </button>
            </div>
        </div>

<div id="board"
    class="grid grid-cols-6 grid-rows-4 w-full max-w-xl p-2 md:p-4 outline-2 gap-1 rounded bg-secondary-bg aspect-6/4">
</div>

    </main>
</body>
<script src="main.js"></script>

</html>
