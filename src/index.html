<!doctype html>
<html lang="en" data-theme="geoshuffle">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoShuffle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body class="bg-base-100 text-base-content min-h-screen w-full">

  <main class="w-full max-w-2xl mx-auto p-4 box-border">

    <header class="flex items-center justify-between mb-6">
      <h1 class="text-4xl md:text-6xl font-black tracking-widest uppercase small-caps">GeoShuffle</h1>
      <button class="btn btn-square btn-outline border-neutral text-base-content" onclick="settings_modal.showModal()">
        ⚙️
      </button>
    </header>

    <section class="flex flex-row items-center justify-between gap-2 sm:gap-4 w-full mb-6 box-border">
      <div
        class="flex flex-row sm:flex-col items-center justify-center gap-1.5 sm:gap-0 flex-1 min-w-0 p-2 sm:p-3 bg-base-100 border-4 border-neutral rounded-xl">
        <span class="text-[10px] sm:text-xs uppercase font-bold tracking-wider opacity-80 whitespace-nowrap">Time</span>
        <span id="stat-time" class="text-base sm:text-2xl font-black">00:00</span>
      </div>

      <div
        class="flex flex-row sm:flex-col items-center justify-center gap-1.5 sm:gap-0 flex-1 min-w-0 p-2 sm:p-3 bg-base-100 border-4 border-neutral rounded-xl">
        <span
          class="text-[10px] sm:text-xs uppercase font-bold tracking-wider opacity-80 whitespace-nowrap">Moves</span>
        <span id="stat-moves" class="text-base sm:text-2xl font-black">0</span>
      </div>

      <button id="new-game"
        class="btn btn-primary flex-[1.2] min-w-0 text-sm sm:text-base font-bold rounded-xl whitespace-nowrap">
        New Game
      </button>
    </section>

    <section class="mb-8 w-full flex justify-center">
      <div id="board"
        class="aspect-6/4 bg-base-200 border-4 border-neutral rounded-xl overflow-hidden shadow-md"></div>
    </section>

    <section class="flex flex-col gap-6 w-full">
      <article class="bg-base-100 border-4 border-neutral rounded-xl overflow-hidden">
        <div
          class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 p-4 border-b-2 border-neutral/10">
          <h2 class="text-lg font-black tracking-wide">🌍 Global Rankings</h2>
          <div id="global-tabs" class="join bg-base-300/30 p-0.5 rounded-xl">
            <button class="btn btn-sm join-item font-bold border-none btn-active" data-type="time">Time</button>
            <button class="btn btn-sm join-item font-bold border-none btn-ghost" data-type="moves">Moves</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table id="global-table" class="table w-full text-center font-bold">
            <thead>
              <tr class="text-base-content/60 border-b border-neutral/20 text-xs sm:text-sm">
                <th>#</th>
                <th>Player</th>
                <th>Time</th>
                <th>Moves</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </article>

      <article class="bg-base-100 border-4 border-neutral rounded-xl overflow-hidden">
        <div
          class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 p-4 border-b-2 border-neutral/10">
          <h2 class="text-lg font-black tracking-wide">🏠 Personal Bests</h2>
          <div id="local-tabs" class="join bg-base-300/30 p-0.5 rounded-xl">
            <button class="btn btn-sm join-item font-bold border-none btn-active" data-type="time">Time</button>
            <button class="btn btn-sm join-item font-bold border-none btn-ghost" data-type="moves">Moves</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table id="local-table" class="table w-full text-center font-bold">
            <thead>
              <tr class="text-base-content/60 border-b border-neutral/20 text-xs sm:text-sm">
                <th>#</th>
                <th>Date</th>
                <th>Time</th>
                <th>Moves</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <dialog id="settings_modal" class="modal">
    <div class="modal-box bg-base-100 border-4 border-neutral text-base-content font-bold rounded-2xl p-6">
      <h2 class="text-2xl font-black mb-6 uppercase tracking-wide">Settings</h2>
      <div class="space-y-6">
        <label class="flex justify-between items-center cursor-pointer">
          <span class="text-base font-bold">Number Assist</span>
          <input id="setting-numbers" type="checkbox" class="toggle toggle-success" checked />
        </label>

        <label class="flex justify-between items-center cursor-pointer">
          <span class="text-base font-bold">Sound Effects</span>
          <input id="setting-sound" type="checkbox" class="toggle toggle-success" checked />
        </label>

        <div class="form-control w-full">
          <span class="text-base font-bold mb-2">Display Theme</span>
          <div class="join w-full bg-base-200 p-1 rounded-xl border border-neutral/10">
            <button class="btn btn-xs sm:btn-sm join-item flex-1 border-none bg-neutral text-base-100"
              data-theme-btn="geoshuffle">☀️ Light</button>
            <button class="btn btn-xs sm:btn-sm join-item flex-1 border-none btn-ghost text-base-content"
              data-theme-btn="geoshuffle-dark">🌙 Dark</button>
          </div>
        </div>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop bg-black/40 backdrop-blur-xs">
      <button>close</button>
    </form>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>

</html>
